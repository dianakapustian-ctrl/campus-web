
<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus — маркетплейс для студентів</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Шапка сайту -->
  <header class="site-header">
    <div class="container header-inner">

      <a href="index.html" class="logo" aria-label="Campus — головна сторінка">
        <img src="assets/logo.svg" alt="Логотип Campus">
      </a>

      <nav class="main-nav" aria-label="Головна навігація">
        <a href="#listings">Оголошення</a>
        <a href="#categories">Категорії</a>
        <a href="#how-it-works">Як це працює</a>
      </nav>

      <div class="header-actions">
        <a href="#login" class="login-link">
          <span aria-hidden="true">♙</span>
          Увійти
        </a>
        <a href="#create-listing" class="btn btn-primary">
          <span aria-hidden="true">✚</span>
          Подати оголошення
        </a>
      </div>

    </div>
  </header>

  <!-- Основний вміст -->
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="container">
        <div class="hero-panel">

          <div class="hero-content">
            <p class="hero-label">МАРКЕТПЛЕЙС ДЛЯ СВОЇХ</p>

            <h1 id="hero-title">
              Знаходь потрібне.<br>
              Віддавай зайве.
            </h1>

            <p class="hero-description">
              Тисячі оголошень поруч — від техніки й авто
              до житла, роботи та добрих знахідок.
            </p>
          </div>

          <div class="hero-illustration" aria-hidden="true">
            <img src="assets/hero.svg" alt="">
          </div>

        </div>
      </div>
    </section>
  </main>

  <!-- Підвал сайту -->
  <footer class="site-footer">
    <div class="container footer-inner">

      <a href="index.html" class="logo" aria-label="Campus — головна сторінка">
        <img src="assets/logo.svg" alt="Логотип Campus">
      </a>

      <nav class="footer-nav" aria-label="Додаткова навігація">
        <a href="#about">Про Campus</a>
        <a href="#safety">Безпека</a>
        <a href="#help">Допомога</a>
        <a href="#rules">Правила</a>
      </nav>

      <p class="copyright">© 2026 Campus</p>

    </div>
  </footer>

</body>
</html>
